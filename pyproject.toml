[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramplab"
version = "1.3.0"
description = "A local-only intentionally vulnerable Web3 fintech security lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
chain = ["web3>=7,<9"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "web3>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
